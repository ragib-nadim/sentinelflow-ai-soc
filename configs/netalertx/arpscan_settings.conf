# SentinelFlow AI SOC: NetAlertX ARPSCAN Configuration
# Configured via NetAlertX Web UI -> Settings -> Device scanners -> ARPSCAN
ARPSCAN_RUN='schedule'
ARPSCAN_CMD='python3 /app/server/plugins/arp_scan/script.py userSubnets={subnets}'
ARPSCAN_RUN_TIMEOUT=300
ARPSCAN_RUN_SCHD='*/5 * * * *'
ARPSCAN_SET_ALWAYS=['devMac', 'devLastIP']
ARPSCAN_WATCH=['watchedValue1', 'watchedValue2']
ARPSCAN_REPORT_ON=['new']
